# Same shape as the project config.toml, scaled down to the fixture dataset. Shared by the
# tests and the `docs-screenshots` command. `{checkpoint}` is replaced by the tests with a tiny
# local checkpoint; the Linear tagger ignores it.
seed = 7

[data]
frequency_cutoff = 5

[split]
train_ratio = 0.70
validation_ratio = 0.15
test_ratio = 0.15

[linear_tagger]
word_ngram_range = [1, 2]
char_ngram_range = [2, 4]
min_df = 1
sublinear_tf = true
C = 10.0
class_weight = "balanced"
max_iter = 1000

[transformer_tagger]
checkpoint = "{checkpoint}"
learning_rate = 1e-3
batch_size = 8
epochs = 2
warmup_ratio = 0.1
weight_decay = 0.01
patience = 1
max_length_percentile = 99
inference_batch_size = 16
num_threads = 2

[quality_gate.min_test_micro_f1]
linear = 0.20
transformer = 0.20
