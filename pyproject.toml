[project]
name = "so-tagger"
version = "0.1.0"
description = "Suggests tags for a StackOverflow question from its title."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
so-tagger = "so_tagger.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so_tagger"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Third-party libraries without type stubs are silenced per module, never globally:
# [[tool.mypy.overrides]]
# module = ["sklearn.*", "joblib.*"]
# ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=so_tagger",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: heavy tests (training, large models); deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
branch = true
source = ["so_tagger"]
