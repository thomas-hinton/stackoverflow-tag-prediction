[project]
name = "so-tagger"
version = "0.1.0"
description = "Suggests tags for a StackOverflow question from its title."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The Transformer tagger. Kept out of the base install so that the Linear tagger stays light.
# torch comes from the PyTorch CPU wheel index (see [tool.uv.sources]), never as CUDA wheels.
transformer = [
    "torch>=2.4",
    "transformers>=4.44",
]

[project.scripts]
so-tagger = "so_tagger.cli:app"
docs-screenshots = "so_tagger.screenshots.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "pillow>=13.0.0",
    "playwright>=1.65.2",
]
explore = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so_tagger"]

[tool.uv]
default-groups = ["dev"]

# CPU-only PyTorch: avoids multi-GB CUDA wheels locally, in CI and in Docker (ADR 0001).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Third-party libraries without type stubs are silenced per module, never globally.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

# transformers leaves some functions unannotated (`PreTrainedModel.eval`,
# `get_linear_schedule_with_warmup`, ...): allow calling them from this module only.
[[tool.mypy.overrides]]
module = ["so_tagger.taggers.transformer"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=so_tagger",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: heavy tests (training, large models); deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
branch = true
source = ["so_tagger"]
