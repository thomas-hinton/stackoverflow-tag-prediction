# Start the API from the image published on GHCR:
#   docker compose up
# Pick another Release than the latest one:
#   SO_TAGGER_IMAGE_TAG=v0.1.0 docker compose up
# Build the image locally from a Release instead of pulling it:
#   RELEASE_TAG=v0.1.0 docker compose -f compose.yaml -f compose.build.yaml up --build
services:
  api:
    image: ghcr.io/thomas-hinton/stackoverflow-tag-prediction:${SO_TAGGER_IMAGE_TAG:-latest}
    ports:
      - "${SO_TAGGER_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
