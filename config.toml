# Project configuration, versioned with the code.

# Seeds every random component: the split and the Taggers.
seed = 42

[data]
# A Tag becomes a Supported tag when at least this many distinct Questions carry it.
# Questions left with no Supported tag are dropped. Rationale: docs/adr/0003.
frequency_cutoff = 20

[split]
# Share of Questions in each set; they must sum to 1.
train_ratio = 0.70
validation_ratio = 0.15
test_ratio = 0.15

[linear_tagger]
# TF-IDF on word n-grams combined with TF-IDF on character n-grams within word boundaries
# (they cope with tokens such as `c#`, `.net`, `asp.net-mvc` and with typos), followed by
# one-vs-rest logistic regression over the Supported tags.
word_ngram_range = [1, 2]
char_ngram_range = [2, 5]
min_df = 2
sublinear_tf = true
C = 10.0
class_weight = "balanced"   # "balanced" or "none"
max_iter = 1000
# No score_cutoff here: `train` tunes it on the validation split and saves it with the Tagger.

[transformer_tagger]
# DistilBERT fine-tuned on CPU with a multi-label head: one sigmoid output per Supported tag,
# binary cross-entropy loss. Rationale: docs/adr/0001. Needs the `transformer` extra:
# `uv sync --extra transformer`.
checkpoint = "distilbert-base-uncased"   # Hugging Face Hub id or local directory
# 86 sigmoid outputs trained on 2,870 Titles: with 5e-5, batch 32 and patience 1 the model
# stays on the "predict the Tag frequencies" plateau (validation micro-F1 0.13) and stops early.
# A higher rate, twice as many steps per epoch and patience 2 get past it (micro-F1 0.53).
learning_rate = 1e-4        # AdamW, linear schedule with warmup
batch_size = 16
epochs = 10                 # maximum; the epoch with the best validation micro-F1 is kept
warmup_ratio = 0.1
weight_decay = 0.01
patience = 2                # epochs without improvement before early stopping
max_length_percentile = 99  # truncate Titles at the token length covering this percentile
inference_batch_size = 128
num_threads = 0             # CPU threads for PyTorch; 0 keeps PyTorch's default
# No score_cutoff here: `train` tunes it on the validation split and saves it with the Tagger.

[quality_gate.min_test_micro_f1]
# Floor on the test micro-F1, per Tagger kind: `gate` fails, and the training workflow publishes
# no Release, when a Tagger scores below it.
#
# Rule: floor = lowest test micro-F1 observed on the CT runs - 0.03, rounded down to two decimals.
# The margin must stay above the run-to-run noise, so that only a real regression fails the gate.
#
# Observed on 2026-11-27 on 4 CT runs (same split, configuration and seed 42; one of them gave
# PyTorch 4 threads instead of 2):
#   Linear tagger       test micro-F1 0.50851 on every run, and on 5 local runs with seeds 42, 1,
#                       7, 2024 and 31415 (liblinear reaches the same optimum whatever the seed):
#                       noise 0. Macro-F1 0.463, validation micro-F1 0.523.
#   Transformer tagger  test micro-F1 0.51237, 0.51237, 0.5013 and 0.48998: hosted runners differ
#                       in CPU, and the thread count changes the arithmetic, so the score moves by
#                       up to 0.022. Macro-F1 0.342 to 0.374. Validation micro-F1 plateaus from
#                       epoch 8, between 0.519 and 0.531 on the 3 runs whose epochs were checked,
#                       so the score does not hang on one lucky epoch.
# The 0.03 margin is larger than that noise.
linear = 0.47        # 0.50851 - 0.03 = 0.47851
transformer = 0.45   # 0.48998 - 0.03 = 0.45998
