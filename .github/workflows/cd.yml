name: CD

# Builds the API image from a Release, smoke-tests it and publishes it to GHCR.
#
# A Release created inside another workflow with the default GITHUB_TOKEN does not trigger
# `release` events, so the training workflow (#9) calls this one through `workflow_call`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build the image from (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build the image from (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    env:
      SMOKE_IMAGE: so-tagger:smoke
    steps:
      - name: Resolve the Release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "image=ghcr.io/${REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      # The image is built from the code of the Release, not from the ref that ran this workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Record the Release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            RELEASE_TAG=${{ steps.release.outputs.tag }}
            REPOSITORY=${{ github.repository }}
            COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker run --detach --name smoke --publish 8000:8000 "$SMOKE_IMAGE"
          trap 'docker logs smoke; docker rm --force smoke > /dev/null' EXIT

          for _ in $(seq 30); do
            if curl --silent --fail http://127.0.0.1:8000/health > health.json; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8000/health > health.json
          cat health.json
          jq --exit-status --arg tag "$RELEASE_TAG" \
            '.status == "ok" and .taggers.linear.version == $tag' health.json

          curl --silent --fail -X POST http://127.0.0.1:8000/suggest \
            -H 'Content-Type: application/json' \
            -d '{"title": "How do I parse JSON in Python?"}' > suggest.json
          cat suggest.json
          jq --exit-status --arg tag "$RELEASE_TAG" \
            '(.suggestions | length) >= 1 and .version == $tag' suggest.json

          test "$(docker inspect --format '{{.Config.User}}' "$SMOKE_IMAGE")" = "tagger:tagger"

      # Same inputs as the build above: every layer comes from the cache.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.image }}:latest
          build-args: |
            RELEASE_TAG=${{ steps.release.outputs.tag }}
            REPOSITORY=${{ github.repository }}
            COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha

      - name: Summary
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Image published"
            echo
            echo "- \`$IMAGE:$RELEASE_TAG\`"
            echo "- \`$IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
